name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13.14", "3.14" ]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install recorded scientific runtime
        if: matrix.python-version == '3.13.14'
        run: |
          python -m pip install --require-hashes -r environments/mapexploc-runtime.lock
          python -m pip freeze > "$RUNNER_TEMP/mapexploc-core-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/mapexploc-core-constraints.txt" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,plots]"
          python -m pip check
      - name: Run pre-commit hooks
        run: pre-commit run --all-files
      - name: Verify required scientific assets
        run: python scripts/ci_verify_assets.py
      - name: Run tests
        run: python -m pytest tests/
      - name: Run type checks
        run: python -m mypy src
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Build distributions
        run: python -m build
      - name: Test installed wheel
        run: python scripts/ci_package_smoke.py dist

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: pnpm check
      - name: Install local API
        working-directory: .
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Test production browser workflows
        run: pnpm test:e2e
